---
- name: nginx installation
  hosts: demo
  become: true
  vars:
    container_name: "my_nginx"
    nginx_image: "nginx:latest"
    nginx_dir: /home/alexwsl/nginx

  tasks:

    - name: Создать каталог для файлов Nginx
      file:
        path: "{{ nginx_dir }}"
        state: directory
        mode: "0755"

    - name: Скопировать nginx.conf
      copy:
        src: dom99/nginx.conf
        dest: "{{ nginx_dir }}/nginx.conf"
        mode: "0644"

    - name: Скопировать index.html
      copy:
        src: dom99/index.html
        dest: "{{ nginx_dir }}/index.html"
        mode: "0644"

    - name: Запуск контейнера
      docker_container:
        name: "{{ container_name }}"
        image: "{{ nginx_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8081:80"
        volumes:
          - "{{ nginx_dir }}/index.html:/usr/share/nginx/html/index.html:ro"
          - "{{ nginx_dir }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro"

    - name: Проверить, что сервер отвечает
      uri:
        url: "http://localhost:8081"
        status_code: 200
      register: result
      retries: 5
      delay: 2
      until: result.status | default(0) == 200
