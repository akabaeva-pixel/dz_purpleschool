services:
  nginx:
    image: nginx:1.27
    configs:
    - source: my_nginx_config
      target: /etc/nginx/nginx.conf
    ports:
    - 3002:80
    networks:
    - myNetwork
    deploy:
      mode: global
      restart_policy: 
        condition: any
  postgres:
    image: postgres:13
    environment: 
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports: 
    - 5432:5432
    networks:
    - myNetwork
    volumes:
    - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy: 
        condition: any
      placement:
        constraints:
          - node.labels.role == server3

networks:
  myNetwork:
    driver: overlay
configs:
  my_nginx_config:
    file: ./nginx.conf 
volumes:
  postgres_data:
secrets:
  pg_password:
    file: ./pg_password.txt